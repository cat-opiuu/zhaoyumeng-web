<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>移动端手势 · 双指缩放图片查看器</title>
<!--
  作者：赵予萌　学号：219
  建立时间：2026-11-18 00:00:00
  使用大模型：GLM-5.3-Flash
  功能名称：移动端图片查看器（双指捏合 1~4 倍缩放、中点锚定缩放不跳、单指拖动回弹、双击 1x/2x 切换）
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#111827;color:#e5e7eb;display:flex;flex-direction:column;padding:14px 14px 24px}

  .zym_head{max-width:560px;width:100%;margin:0 auto}
  .zym_head .zym_badge{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:12px;letter-spacing:2px;margin-bottom:8px}
  .zym_head h1{font-size:19px;letter-spacing:1px}
  .zym_tip{margin-top:8px;font-size:13px;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:8px 12px;line-height:1.9}  /* 需求⑥：打开时的操作提示 */

  /* 查看器容器：需求① —— overflow:hidden 裁掉放大溢出的部分，
     touch-action:none 把所有触摸手势都交给 JS（浏览器不再接管缩放/滚动），
     user-select:none 防止长按图片弹出选中/菜单 */
  .zym_box{
    position:relative;width:100%;max-width:560px;height:62vh;margin:14px auto 0;
    border-radius:16px;overflow:hidden;background:#1f2937;
    touch-action:none;user-select:none;-webkit-user-select:none;
    box-shadow:0 14px 30px rgba(0,0,0,.4);
  }
  .zym_box img{
    display:block;width:100%;height:100%;object-fit:contain;
    will-change:transform;pointer-events:none;
  }
  /* 双击切换专用：只在这 0.25s 内开过渡（需求⑤），捏合过程中必须关着，否则会"跟手变慢" */
  .zym_anim{transition:transform .25s ease}

  .zym_info{max-width:560px;width:100%;margin:12px auto 0;display:flex;justify-content:space-between;font-size:13px;color:#9ca3af}
  .zym_info b{color:#e5e7eb}
  .zym_back{text-align:center;margin-top:18px}
  .zym_back a{display:inline-block;text-decoration:none;color:#e5e7eb;font-size:14px;font-weight:bold;background:#1f2937;border:1px solid #374151;border-radius:999px;padding:9px 22px}
  .zym_back a:hover{border-color:#6b7280}
</style>
</head>
<body>
<div class="zym_head">
  <span class="zym_badge">P I N C H · 双 指 缩 放</span>
  <h1>🔍 双指缩放图片查看器</h1>
  <p class="zym_tip">⚠️ 双指缩放请用手机打开（本页图片已内嵌，单文件发送到手机也能显示）：<br>双指捏合缩放 1~4 倍 · 单指拖动查看细节 · 双击在 1x / 2x 间切换 · 电脑端可用<b>鼠标拖动 + 双击</b>演示</p>
</div>

<script>
// 功能：初始化图片查看器——双指捏合缩放（中点锚定）、单指拖动、双击 1x/2x 切换
(function () {
  var zym_box = document.getElementById("zym_box");
  var zym_img = document.getElementById("zym_img");
  var zym_scaleTxt = document.getElementById("zym_scaleTxt");

  // 图像状态：当前缩放倍数与位移（transform: translate(tx,ty) scale(scale)）
  var zym_scale = 1, zym_tx = 0, zym_ty = 0;
  // 双指捏合起点快照：初始两指距离 / 初始倍数 / 初始位移 / 初始两指中点
  var zym_startDist = 0, zym_startScale = 1, zym_startTx = 0, zym_startTy = 0, zym_startMid = null;
  // 单指拖动用的上一次触点坐标
  var zym_lastX = 0, zym_lastY = 0;
  // 双击检测：上一次抬指的时间与位置
  var zym_lastTapTime = 0, zym_lastTapX = 0, zym_lastTapY = 0;
  var zym_animTimer = null;

  // 功能：把屏幕坐标换算成以容器中心为原点的局部坐标（transform-origin 是图片中心，
  //       所以缩放/位移公式都在这套坐标系里推导）
  function zym_local(zym_cx, zym_cy) {
    var zym_r = zym_box.getBoundingClientRect();
    return { x: zym_cx - zym_r.left - zym_r.width / 2, y: zym_cy - zym_r.top - zym_r.height / 2 };
  }

  // 功能：把位移限制在边界内——放大的图片边缘不允许露进容器；
  //       scale 回到 1 时强制回正居中（需求④"松手后限制在边界内"）
  function zym_clamp() {
    var zym_w = zym_img.clientWidth, zym_h = zym_img.clientHeight;
    var zym_maxX = Math.max(0, (zym_w * zym_scale - zym_box.clientWidth) / 2);
    var zym_maxY = Math.max(0, (zym_h * zym_scale - zym_box.clientHeight) / 2);
    zym_tx = Math.min(zym_maxX, Math.max(-zym_maxX, zym_tx));
    zym_ty = Math.min(zym_maxY, Math.max(-zym_maxY, zym_ty));
    if (zym_scale === 1) { zym_tx = 0; zym_ty = 0; }   // 回到 1 倍必须回正
  }

  // 功能：把当前 scale/tx/ty 应用到图片上，并同步左下角的倍数读数
  function zym_apply() {
    zym_img.style.transform = "translate(" + zym_tx + "px," + zym_ty + "px) scale(" + zym_scale + ")";
    zym_scaleTxt.textContent = zym_scale.toFixed(1) + "x";
  }

  // 功能：以某一点为锚点缩放到新倍数——锚点（如两指中点）下的图像点缩放前后保持不动，
  //       推导：图像点 u = (锚点 - t)/s，要求新状态 u 仍在锚点下 → t' = 锚点 - u * s'
  function zym_zoomAt(zym_newScale, zym_px, zym_py) {
    zym_newScale = Math.min(4, Math.max(1, zym_newScale));   // 需求③：限制 1~4 倍
    zym_tx = zym_px - (zym_px - zym_tx) * (zym_newScale / zym_scale);
    zym_ty = zym_py - (zym_py - zym_ty) * (zym_newScale / zym_scale);
    zym_scale = zym_newScale;
    zym_apply();
  }

  // 功能：计算两指间距
  function zym_dist(zym_t1, zym_t2) {
    var zym_dx = zym_t1.clientX - zym_t2.clientX;
    var zym_dy = zym_t1.clientY - zym_t2.clientY;
    return Math.sqrt(zym_dx * zym_dx + zym_dy * zym_dy);
  }

  // 功能：计算两指中点（局部坐标）
  function zym_midOf(zym_t1, zym_t2) {
    var zym_a = zym_local(zym_t1.clientX, zym_t1.clientY);
    var zym_b = zym_local(zym_t2.clientX, zym_t2.clientY);
    return { x: (zym_a.x + zym_b.x) / 2, y: (zym_a.y + zym_b.y) / 2 };
  }

  // 功能：touchstart——记录单指/双指状态（需求②）：
  //       第二根手指落下时拍"捏合快照"（初始距离、初始倍数、初始位移、初始中点）
  zym_box.addEventListener("touchstart", function (zym_e) {
    if (zym_e.touches.length === 1) {
      // 单指：记录触点，为拖动做准备；同时关闭过渡（拖动必须跟手）
      zym_img.classList.remove("zym_anim");
      zym_lastX = zym_e.touches[0].clientX;
      zym_lastY = zym_e.touches[0].clientY;
    } else if (zym_e.touches.length === 2) {
      // 双指：拍快照，之后 touchmove 全部基于这份快照推导，避免逐帧误差累积
      zym_startDist  = zym_dist(zym_e.touches[0], zym_e.touches[1]);
      zym_startScale = zym_scale;
      zym_startTx    = zym_tx;
      zym_startTy    = zym_ty;
      zym_startMid   = zym_midOf(zym_e.touches[0], zym_e.touches[1]);
      zym_img.classList.remove("zym_anim");
    }
  }, { passive: false });

  // 功能：touchmove——双指按"当前距离/初始距离"的比例缩放（需求③）；
  //       单指且已放大（scale>1）时拖动图片（需求④）
  zym_box.addEventListener("touchmove", function (zym_e) {
    zym_e.preventDefault();   // touch-action:none 已挡掉默认手势，这里双保险
    if (zym_e.touches.length === 2) {
      // 双指：新倍数 = 初始倍数 × (当前两指距离 / 初始两指距离)
      var zym_d = zym_dist(zym_e.touches[0], zym_e.touches[1]);
      var zym_newScale = zym_startScale * (zym_d / zym_startDist);
      // 缩放基准 = 两指中点：中点下的图像点保持不动（"缩放不跳"的核心）
      var zym_mid = zym_midOf(zym_e.touches[0], zym_e.touches[1]);
      // 锚点图像点 u 在按下瞬间就固定了：u = (startMid - startT) / startScale
      // 由 中点 = u × s' + t'  反解出 t'，再限制倍数范围
      var zym_s2 = Math.min(4, Math.max(1, zym_newScale));
      zym_tx = zym_mid.x - (zym_startMid.x - zym_startTx) * (zym_s2 / zym_startScale);
      zym_ty = zym_mid.y - (zym_startMid.y - zym_startTy) * (zym_s2 / zym_startScale);
      zym_scale = zym_s2;
      zym_apply();
    } else if (zym_e.touches.length === 1 && zym_scale > 1) {
      // 单指拖动：位移 = 本次触点 - 上次触点，累加到位移量上
      var zym_t = zym_e.touches[0];
      zym_tx += zym_t.clientX - zym_lastX;
      zym_ty += zym_t.clientY - zym_lastY;
      zym_lastX = zym_t.clientX;
      zym_lastY = zym_t.clientY;
      zym_clamp();
      zym_apply();
    }
  }, { passive: false });

  // 功能：touchend——抬指后收尾：钳到边界内、缩回 1 倍时回正、
  //       双指退回单指时重置拖动基准点、检测双击（需求④⑤）
  zym_box.addEventListener("touchend", function (zym_e) {
    if (zym_e.touches.length === 1) {
      // 双指 → 单指：剩余那根手指成为新的拖动起点
      zym_lastX = zym_e.touches[0].clientX;
      zym_lastY = zym_e.touches[0].clientY;
      return;
    }
    if (zym_e.touches.length === 0) {
      // 全部抬指：钳边界 + 回 1 倍回正
      zym_clamp();
      zym_apply();
      // 双击检测：300ms 内两次抬指且位置接近（<30px）→ 1x 与 2x 互切（需求⑤）
      var zym_t = zym_e.changedTouches[0];
      var zym_now = Date.now();
      if (zym_now - zym_lastTapTime < 300 &&
          Math.abs(zym_t.clientX - zym_lastTapX) < 30 &&
          Math.abs(zym_t.clientY - zym_lastTapY) < 30) {
        zym_toggleZoom();                              // 双击成立 → 1x/2x 互切
        zym_lastTapTime = 0;                           // 防止三连击误触发
      } else {
        zym_lastTapTime = zym_now;
        zym_lastTapX = zym_t.clientX;
        zym_lastTapY = zym_t.clientY;
      }
    }
  }, { passive: false });

  // 功能：双击切换 1x 与 2x——以图片中心为基准，只在切换瞬间开 0.25s 过渡（需求⑤）；
  //       手机双击与电脑鼠标双击共用这一个函数
  function zym_toggleZoom() {
    zym_img.classList.add("zym_anim");
    zym_scale = zym_scale > 1 ? 1 : 2;
    zym_tx = 0; zym_ty = 0;
    zym_clamp();
    zym_apply();
    clearTimeout(zym_animTimer);
    zym_animTimer = setTimeout(function () { zym_img.classList.remove("zym_anim"); }, 260);
  }

  // ===== 电脑端鼠标模拟（不影响手机 touch 事件，方便课堂上没有手机时演示）=====
  var zym_mouseDown = false;

  // 功能：按住左键拖动图片——等价单指拖动，必须先放大到 scale>1 才生效
  zym_box.addEventListener("mousedown", function (zym_m) {
    if (zym_scale <= 1) return;                        // 1 倍时无可拖区域（按需求④）
    zym_mouseDown = true;
    zym_img.classList.remove("zym_anim");              // 拖动必须跟手，关掉过渡
    zym_lastX = zym_m.clientX;
    zym_lastY = zym_m.clientY;
    zym_m.preventDefault();                            // 防止拖出图片产生系统拖拽
  });

  // 功能：鼠标移动时拖动图片——监听挂 window，鼠标滑出容器也不会"脱手"
  window.addEventListener("mousemove", function (zym_m) {
    if (!zym_mouseDown) return;
    zym_tx += zym_m.clientX - zym_lastX;
    zym_ty += zym_m.clientY - zym_lastY;
    zym_lastX = zym_m.clientX;
    zym_lastY = zym_m.clientY;
    zym_clamp();
    zym_apply();
  });

  // 功能：松开左键收尾——钳回边界内、回 1 倍时回正
  window.addEventListener("mouseup", function () {
    if (!zym_mouseDown) return;
    zym_mouseDown = false;
    zym_clamp();
    zym_apply();
  });

  // 功能：鼠标双击与手机双击走同一套 1x/2x 切换逻辑
  zym_box.addEventListener("dblclick", function () { zym_toggleZoom(); });
})();
</script>
</body>
</html>
