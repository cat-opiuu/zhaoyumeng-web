<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗欣赏 · 上图下文卡片</title>
<!--
  作者：赵予萌
  建立时间：2026-11-13 10:00:00
  使用大模型：GLM-5.3-Flash
  功能名称：古诗欣赏页面（上图下文结构，数据来自本地 3004 端口服务器 db/db.json）
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f3f5f9;color:#1f2937;padding:40px 20px 60px}
  .zym_wrap{max-width:1100px;margin:0 auto}
  .zym_head{background:linear-gradient(135deg,#4338ca,#7c3aed);border-radius:18px;padding:26px 30px;color:#fff;margin-bottom:24px;box-shadow:0 12px 30px rgba(67,56,202,.25)}
  .zym_head .zym_badge{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:12px;letter-spacing:2px;margin-bottom:10px}
  .zym_head h1{font-size:24px;letter-spacing:2px}
  .zym_head p{margin-top:8px;font-size:13.5px;color:#e4e1fb;line-height:1.9}

  /* 卡片列表：上图下文 */
  .zym_list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .zym_card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;box-shadow:0 4px 14px rgba(31,41,55,.06);transition:transform .2s,box-shadow .2s}
  .zym_card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(67,56,202,.16)}
  .zym_card img{display:block;width:100%;height:180px;object-fit:cover;background:#eef2ff}
  .zym_body{padding:14px 16px 16px}
  .zym_body h3{font-size:17px;color:#312e81;letter-spacing:1px}
  .zym_body h3::before{content:"《"}
  .zym_body h3::after{content:"》"}
  .zym_body p{margin-top:8px;font-size:13.5px;color:#4b5563;line-height:2}
  /* 加载状态与错误提示 */
  .zym_tip{text-align:center;color:#9ca3af;font-size:14px;padding:40px 0}
  .zym_err{color:#b91c1c;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.9}

  .zym_back{text-align:center;margin-top:30px}
  .zym_back a{display:inline-block;text-decoration:none;color:#312e81;font-size:14px;font-weight:bold;background:#fff;border:1px solid #dbe4ff;border-radius:999px;padding:9px 22px;margin:0 6px;transition:transform .2s,box-shadow .2s}
  .zym_back a:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,56,202,.15)}
</style>
</head>
<body>
<div class="zym_wrap">
  <div class="zym_head">
    <span class="zym_badge">P O E M S · 古 诗 欣 赏</span>
    <h1>古诗欣赏 · 上图下文</h1>
    <p>数据来源：本地服务器（端口 3004）读取 db/db.json 的 poems 数组——图片 pic、标题 title、内容 content。启动方式：在 db 文件夹执行 node server.js。</p>
  </div>

  <div class="zym_list" id="zym_list">
    <p class="zym_tip" id="zym_tip">正在加载数据……</p>
  </div>

  <div class="zym_back">
    <a href="index.html">返回首页</a>
  </div>
</div>

<script>
// 功能：从本地服务器获取 db.json 的 poems 数据并渲染"上图下文"卡片列表
function zym_loadPoems() {
  var zym_xhr = new XMLHttpRequest();
  zym_xhr.open("GET", "/api/poems", true);
  zym_xhr.onreadystatechange = function () {
    if (zym_xhr.readyState !== 4) return;
    var zym_list = document.getElementById("zym_list");
    if (zym_xhr.status !== 200) {
      // 服务器未启动或接口异常时给出提示
      zym_list.innerHTML = '<p class="zym_err">加载失败（HTTP ' + zym_xhr.status + '）：本页数据来自 3004 端口数据服务器，请先在 db 文件夹执行 <b>node server.js</b>，然后在浏览器地址栏访问 <b>http://localhost:3004/poems.html</b>（不要用编辑器预览端口打开）。</p>';
      return;
    }
    var zym_data = JSON.parse(zym_xhr.responseText);
    var zym_html = "";
    for (var zym_i = 0; zym_i < zym_data.poems.length; zym_i++) {
      var zym_p = zym_data.poems[zym_i];
      // 外链图片走服务器代理 /api/img（避免跨域图床被浏览器 ORB 策略拦截），本地图片直接使用原路径
      var zym_src = /^https?:/i.test(zym_p.pic) ? "/api/img?url=" + encodeURIComponent(zym_p.pic) : zym_p.pic;
      zym_html += '<div class="zym_card">'
        + '<img src="' + zym_src + '" alt="' + zym_p.title + '配图">'
        + '<div class="zym_body"><h3>' + zym_p.title + '</h3><p>' + zym_p.content + '</p></div>'
        + '</div>';
    }
    zym_list.innerHTML = zym_html;
  };
  zym_xhr.send();
}
zym_loadPoems();
</script>
</body>
</html>
